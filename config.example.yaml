# Protectarr configuration. Copy to config.yaml (or mount at /config/config.yaml).
# Secrets can also be supplied via env vars (see README): PROTECTARR_QBIT_PASSWORD, etc.

qbittorrent:
  url: http://192.168.1.100:8080
  # qBittorrent >= 5.2.0: paste an API key (starts with "qbt_"). If set, it's
  # used instead of username/password. Also settable via PROTECTARR_QBIT_API_KEY.
  api_key: ""
  # Fallback for older qBittorrent (< 5.2.0):
  username: admin
  password: ""            # set here, or via PROTECTARR_QBIT_PASSWORD
  verify_ssl: true

arrs:
  - name: Sonarr
    type: sonarr          # sonarr | radarr | lidarr | readarr | whisparr
    url: http://192.168.1.100:8989
    api_key: "your-sonarr-api-key"
  # - name: Radarr
  #   type: radarr
  #   url: http://192.168.1.100:7878
  #   api_key: "your-radarr-api-key"

detection:
  blocked_extensions:
    - .exe
    - .scr
    - .bat
    - .com
    - .cmd
    - .msi
    - .pif
    - .vbs
    - .js
    - .jar
    - .lnk
    - .ps1
    - .url
  # Only inspect torrents still downloading (fast; finished seeds are skipped).
  only_active: true
  # Tier 2 - flag by filename: a text-like companion file (readme/nfo/url) whose
  # name contains one of these substrings. Never matches media files, so a real
  # release named "Password.mkv" is safe.
  blocked_name_keywords:
    - password
    - passw0rd
    - how to download
  # Tier 3 - archive-with-no-media. OPT-IN and indexer-scoped, because legit
  # releases (esp. private trackers) are sometimes packed as RARs. Only fires for
  # an *arr-tracked torrent whose indexer is listed here. Empty list = disabled.
  archive_detection:
    enabled: false
    indexers: []          # e.g. [Limetorrents, 1337x]
    archive_extensions: [.rar, .zip, .7z, .z01, .zipx, .tar, .gz, .bz2, .arj, .cab]
  # Tier 4 - content probe. Everything above reads the torrent's file list, so
  # it cannot see a payload wearing a real .mkv/.mp4 extension. This downloads
  # the first piece of one file (a few MB, not the torrent) and checks the bytes
  # are the format the name claims. OFF by default: it costs bandwidth, it needs
  # to read qBittorrent's download directory, and it briefly changes per-file
  # priorities (always restored, and restored on the next start if Protectarr is
  # killed mid-probe). A file it cannot read, cannot recognise, or runs out of
  # budget on produces NO finding - never a removal.
  probe:
    enabled: false
    # Protectarr must be able to read the files qBittorrent writes. Map
    # qBittorrent's path to the path Protectarr sees. Omit if they match.
    path_mappings: []
    #  - {from: /downloads, to: /downloads}
    # false = only ever read pieces the torrent already happens to have. Costs
    # nothing and changes no settings, but resolves fewer torrents.
    steer: true
    max_torrents_per_scan: 1      # how many torrents may be steered per scan
    torrent_timeout_seconds: 120  # give up on one torrent after this
    scan_budget_seconds: 120      # ...and on the whole probe pass after this
    # Steering only influences the NEXT piece qBittorrent picks, so a torrent
    # this slow will not produce the piece before the budget runs out.
    min_speed_kib: 20
    # A fast torrent can still ignore the file we asked for. Once the piece has
    # plainly not been scheduled, holding the boost for the rest of the budget
    # buys nothing, so the probe gives up and puts the settings back.
    no_progress_seconds: 30       # also on the Content Probe settings page
    recheck_minutes: 15           # don't re-probe the same torrent sooner

safety:
  # arr_tracked : reap only torrents a configured arr is tracking (safest;
  #               your hand-added Linux ISOs are never touched)
  # allowlist   : reap any torrent whose category/tag is listed below
  # both        : must be arr-tracked AND allowlisted
  mode: arr_tracked
  allowed_categories:
    - tv
    - radarr
  allowed_tags: []
  # After reaping, requeue (search for a clean release) ONLY once the
  # episode/movie has aired/released. If it hasn't aired yet, no legit release
  # can exist, so hold and let the arr's normal RSS grab the real one later.
  # Set false to never requeue (blocklist only).
  requeue_after_airdate: true
  # Wait this many hours past the air/release time before requeuing (web
  # releases often appear a little after the broadcast slot).
  airdate_grace_hours: 0
  # A torrent that leaves its arr's queue is remembered as that arr's orphan
  # rather than becoming an ordinary untracked torrent. This is how long it
  # must be continuously absent before Protectarr will act on it. Only passes
  # where that arr's queue was actually READ count, so an arr that is down
  # never ages its own downloads into orphans.
  orphan_dwell_minutes: 10        # also on the Reaping Rules settings page
  # How often to forget torrents qBittorrent no longer has. Needs the full
  # torrent list, measured at 389 ms against a 1208-torrent library.
  ownership_prune_minutes: 60

poll_interval: 20         # seconds between scans
dry_run: true             # true = log only; set false to actually reap

# Swarm observations. Before removing a fake, Protectarr enumerates its swarm
# and records the peers as evidence in evidence.db beside this file. Passive:
# it collects data and never bans anything on its own.
#
# The retention numbers below came out of a growth model measured against real
# swarm captures, so the defaults are the recommended values rather than round
# guesses. Detail expires first; the per-IP summary outlives it, because an
# IP's recurrence is what stays interesting long after the per-peer detail of
# any single encounter has stopped being.
harvest:
  enabled: true
  detail_encounters: 2000       # keep per-peer detail for the newest N encounters
  single_profile_days: 90       # forget IPs seen in exactly one encounter after
  recurring_profile_days: 365   # ...and IPs seen in two or more after

# Optional: peer IP blocklist applied to qBittorrent's IP filter.
ip_blocklist:
  enabled: false
  url: https://github.com/Naunter/BT_BlockLists/raw/master/bt_blocklists.gz
  # Where the list is written - MUST be readable by qBittorrent. In Docker,
  # mount a shared volume into both containers and use qBittorrent's path here.
  path: /blocklist/ipfilter.p2p
  update_interval_hours: 24
  apply_to_qbit: true       # set qBittorrent ip_filter_enabled + ip_filter_path
  block_trackers: false

# Optional: a small hand-curated list of IPs pushed to qBittorrent's "manually
# banned IPs" via the API (no file / shared volume needed).
banned_ips:
  enabled: false
  ips: []                   # one IP per entry
  merge_existing: true      # union with qBittorrent's current banned IPs

web:
  enabled: true
  host: 0.0.0.0
  port: 8090
  api_key: ""             # optional; programmatic access (X-Api-Key / ?apikey=)
  auth:
    method: none          # none | basic | forms
    required: enabled     # enabled | local_disabled (bypass auth for LAN clients)
    username: ""
    password_hash: ""     # set via the WebUI (stored hashed)
    trusted_proxies: []   # CIDRs of reverse proxies whose X-Forwarded-For is trusted

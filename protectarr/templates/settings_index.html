{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Settings</h2>
  <div class="body">
    {% for key, label, desc, sections in settings_pages %}
    <a class="settings-link" href="{{ url_for('settings_page', key=key) }}">
      <span class="settings-link-title">{{ label }}</span>
      <span class="hint">{{ desc }}</span>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}

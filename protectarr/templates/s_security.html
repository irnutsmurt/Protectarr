{% extends "base.html" %}
{% block content %}
<form method="post" action="{{ url_for('save_section', section='security') }}">
  <div class="card">
    <h2>Security</h2>
    <div class="body">
      <div class="row">
        <div>
          <label>Authentication</label>
          <select name="auth_method">
            <option value="none" {% if cfg.web.auth.method=='none' %}selected{% endif %}>None</option>
            <option value="basic" {% if cfg.web.auth.method=='basic' %}selected{% endif %}>Basic (browser popup)</option>
            <option value="forms" {% if cfg.web.auth.method=='forms' %}selected{% endif %}>Forms (login page)</option>
          </select>
        </div>
        <div>
          <label>Authentication required</label>
          <select name="auth_required">
            <option value="enabled" {% if cfg.web.auth.required=='enabled' %}selected{% endif %}>Enabled</option>
            <option value="local_disabled" {% if cfg.web.auth.required=='local_disabled' %}selected{% endif %}>Disabled for Local Addresses</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div><label>Username</label><input type="text" name="auth_username" value="{{ cfg.web.auth.username }}" autocomplete="off"></div>
        <div><label>Password</label><input type="password" name="auth_password" placeholder="{{ '(unchanged)' if cfg.web.auth.password_hash else 'set a password' }}" autocomplete="new-password"></div>
      </div>
      <label>Trusted proxies <span class="hint">(CIDRs whose X-Forwarded-For is trusted; needed for "Disabled for Local Addresses" behind a reverse proxy)</span></label>
      <textarea name="trusted_proxies" placeholder="e.g. 172.18.0.0/16">{{ cfg.web.auth.trusted_proxies | join(', ') }}</textarea>
      {% if cfg.web.api_key %}
      <label>API key <span class="hint">(HTTP API - send as the <code>X-Api-Key</code> header or <code>?apikey=</code>; see <code>GET /api/v1</code>)</span></label>
      <div class="secret-field">
        <input type="password" value="{{ cfg.web.api_key }}" readonly autocomplete="off">
        <button type="button" class="btn small reveal" tabindex="-1" onclick="toggleSecret(this)">Show</button>
      </div>
      {% endif %}
    </div>
  </div>
  <button type="submit" class="btn primary">Save</button>
</form>
{% endblock %}
{% block scripts %}{% include "_js.html" %}{% endblock %}

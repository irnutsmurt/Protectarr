services:
  protectarr:
    image: ghcr.io/irnutsmurt/protectarr:latest
    # build: .   # uncomment to build from source instead of pulling the image
    container_name: protectarr
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./config:/config
      # For the optional Content Probe (Settings > Content Probe): Protectarr
      # has to READ the files qBittorrent is writing. Mount the same download
      # directory here, read-only - the probe only ever reads headers, and it
      # steers qBittorrent through its API, never through the filesystem.
      #
      # Easiest: mount it at the SAME path qBittorrent uses, and no path
      # mapping is needed at all:
      # - /mnt/downloads:/downloads:ro  # and in qBittorrent: - /mnt/downloads:/downloads
      #
      # If the paths differ, mount it anywhere and add a mapping on the
      # Content Probe page, e.g. qBittorrent's /downloads = Protectarr's /dl.
      # That page has a "Test against current downloads" button that tells you
      # whether Protectarr can actually see the files.
      #
      # For the optional IP blocklist: mount a shared volume that qBittorrent
      # ALSO mounts (at the same path), and set ip_blocklist.path to it, e.g.:
      # - ./blocklist:/blocklist        # and in qBittorrent: - ./blocklist:/blocklist
    environment:
      # Your timezone, so log and history timestamps match your clock. Without
      # it a container runs on UTC. Can also be set in Settings > Logging.
      # List of timezone names:
      # https://gist.github.com/alejzeis/ad5827eb14b5c22109ba652a1a267af5
      - TZ=America/Los_Angeles
      # Prefer secrets via env over writing them into config.yaml.
      # qBittorrent >= 5.2.0: use an API key…
      - PROTECTARR_QBIT_API_KEY=${QBIT_API_KEY:-}
      # …or fall back to username/password on older versions:
      - PROTECTARR_QBIT_PASSWORD=${QBIT_PASSWORD:-}
    # Protectarr must reach qBittorrent + your *arr apps. If they run in this
    # same compose stack, put them on a shared network and use service names in
    # the URLs (e.g. http://qbittorrent:8080). Otherwise the LAN IPs work as-is.
    # networks:
    #   - arr
# networks:
#   arr:
#     external: true
